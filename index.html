    .tabs { display: flex; gap: 0.4rem; margin-top: 0.85rem; overflow-x: auto; padding-bottom: 0.25rem; -webkit-overflow-scrolling: touch; }
    .tab { flex-shrink: 0; padding: 0.45rem 0.9rem; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 0.875rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .tab:hover { background: var(--card-hover); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .subtabs { display: none; gap: 0.35rem; margin-top: 0.6rem; overflow-x: auto; padding-bottom: 0.2rem; -webkit-overflow-scrolling: touch; }
    .subtabs.show { display: flex; }
    .subtab { flex-shrink: 0; padding: 0.35rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: rgba(59,130,246,0.08); color: var(--muted); font-size: 0.8rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .subtab:hover { background: rgba(59,130,246,0.18); color: var(--text); }
    .subtab.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; font-weight: 600; }

    .section-title span.count { background: var(--border); padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.85rem; }
    .item-card, .floor-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; transition: border-color 0.15s, transform 0.15s; }
    .item-card:hover, .floor-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .type-badge { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.45rem; border-radius: 6px; color: #fff; }
    .type-太刀, .type-單手劍, .type-細劍, .type-斧頭, .type-錘 { background: var(--weapon); }
    .type-頭盔 { background: var(--head); }
    .type-身體 { background: var(--body); }
    .type-副手 { background: var(--offhand); }
    .type-鞋子 { background: var(--shoes); }
    .type-飾物 { background: var(--acc); }
    .stats { font-size: 0.85rem; color: var(--muted); margin: 0.4rem 0 0.6rem; line-height: 1.45; }

    .floor-chip:hover { background: rgba(59,130,246,0.3); }
    .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 0.2rem 0.45rem; font-size: 0.75rem; cursor: pointer; margin-left: auto; }
    .copy-btn:hover { border-color: var(--success); color: var(--success); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.1); }
    .boss-name { font-size: 0.9rem; color: #c4b5fd; margin-bottom: 0.5rem; }

    .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #166534; color: #fff; padding: 0.65rem 1.25rem; border-radius: 10px; font-size: 0.9rem; opacity: 0; transition: all 0.3s; z-index: 200; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 480px) { header h1 { font-size: 1.1rem; } .grid { grid-template-columns: 1fr; } main { padding: 0.75rem 0.85rem 2.5rem; } }

        {type:"鞋子", name:"毒蘑菇婆婆的跑邪", stats:"攻擊+54 防禦+29 HP上限-430 敏捷+7"}
      ]},
      { floor:29, boss:"九頭舌 海綽拉", lv:"Lv38", drops:[
        {type:"副手", name:"九頭舌的鱗盾", stats:"防禦+297 HP上限+1187 敏捷-18 格擋率+15.8% 攻速×0.9"},
        {type:"鞋子", name:"海綽拉的跑邪", stats:"攻擊+57 防禦+30 HP上限-445 敏捷+7"},
        {type:"飾物", name:"海綽拉的戒脂", stats:"敏捷+16 爆擊率+6.4%"}
      ]},
      { floor:30, boss:"龍谷之主 巨聾王", lv:"Lv39", drops:[
        {type:"身體", name:"聾王鎧", stats:"防禦+267 HP上限+1996"},
        {type:"單手劍", name:"巨聾王的賤", stats:"攻擊+196 爆擊傷害+52% 攻速 100"},
        {type:"細劍", name:"巨聾王的細賤", stats:"攻擊+88 爆擊率+20% 攻速 125"}
      ]},
      { floor:31, boss:"迷霧大濕", lv:"Lv41", drops:[
        {type:"鞋子", name:"霧行靴", stats:"防禦+64 敏捷+47 迴避率+3.7%"},
        {type:"太刀", name:"迷霧大濕的太倒", stats:"攻擊+213 爆擊率+22.9% 攻速 88"},
        {type:"斧頭", name:"迷霧大濕的巨腐", stats:"攻擊+246 攻速 84"}
      ]},
      { floor:32, boss:"水晶之心 晶晶大王", lv:"Lv41", drops:[
        {type:"飾物", name:"晶心戒指", stats:"敏捷+13 爆擊率+20.8%"},
        {type:"錘", name:"晶晶大王的錘", stats:"攻擊+251 攻速 92"},
        {type:"副手", name:"晶晶大王的頓", stats:"防禦+327 HP上限+1311 敏捷-19 格擋率+16.4% 攻速×0.9"}
      ]},
      { floor:33, boss:"風神 疾風大大", lv:"Lv43", drops:[
        {type:"細劍", name:"疾風細賤", stats:"攻擊+106 爆擊率+5.3% 攻速 137"},
        {type:"身體", name:"疾風大大的鎧假", stats:"防禦+515 HP上限+3709 敏捷-21"},
        {type:"頭盔", name:"疾風大大的頭虧", stats:"攻擊+73 防禦+41"}
      ]},
      { floor:34, boss:"機械巨神 齒輪王", lv:"Lv44", drops:[
        {type:"身體", name:"齒輪鎧", stats:"防禦+529 HP上限+3815 敏捷-21"},
        {type:"鞋子", name:"齒輪王的跑邪", stats:"攻擊+77 防禦+35 HP上限-520 敏捷+8"},
        {type:"飾物", name:"齒輪王的戒指", stats:"敏捷+18 爆擊率+7%"}
      ]}
    ];

    const MAIN_CAT = {
      "太刀":"武器","單手劍":"武器","細劍":"武器","斧頭":"武器","錘":"武器",
      "頭盔":"頭盔","身體":"身體","副手":"副手","鞋子":"鞋子","飾物":"飾物"
    };

    function buildItemIndex() {
      const map = new Map();
      floorsData.forEach(f => {
        f.drops.forEach(d => {
          if (!map.has(d.name)) {
            map.set(d.name, { name:d.name, type:d.type, main:MAIN_CAT[d.type]||"其他", stats:d.stats, floors:[] });
          }
          map.get(d.name).floors.push({ floor:f.floor, boss:f.boss, lv:f.lv });
        });
      });
      // 每個裝備的樓層由小到大排序，裝備本身也依最低樓層排序
      const items = Array.from(map.values());
      items.forEach(item => item.floors.sort((a,b) => a.floor - b.floor));
      items.sort((a,b) => a.floors[0].floor - b.floors[0].floor || a.name.localeCompare(b.name,'zh-Hant'));
      return items;
    }
    const allItems = buildItemIndex();

    const content = document.getElementById('content');
    const searchInput = document.getElementById('search');
    const tabs = document.getElementById('tabs');
    const weaponSubtabs = document.getElementById('weaponSubtabs');
    const toast = document.getElementById('toast');
    let currentView = 'floors', currentSubtype = 'all', searchQuery = '';

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function copyName(name, btn) {
      navigator.clipboard.writeText(name).then(() => {
        btn.classList.add('copied'); btn.textContent = '已複製'; showToast('已複製「'+name+'」');
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '複製'; }, 1500);
      }).catch(() => {
        const ta = document.createElement('textarea'); ta.value = name; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('已複製「'+name+'」');
      });
    }
    function renderItems(items) {
      if (!items.length) { content.innerHTML = '<div class="empty">找不到符合的裝備</div>'; return; }
      content.innerHTML = `<div class="section-title">裝備列表 <span class="count">${items.length}</span></div><div class="grid">${items.map(item => `
        <div class="item-card">
          <div class="item-name"><span class="type-badge type-${item.type}">${item.type}</span>${item.name}
            <button class="copy-btn" onclick="copyName('${item.name.replace(/'/g,"\\'")}',this)">複製</button></div>
          <div class="stats">${item.stats}</div>
          <div class="floors-list">${item.floors.map(f => `<span class="floor-chip" onclick="goToFloor(${f.floor})" title="${f.boss}">第${f.floor}層</span>`).join('')}</div>
        </div>`).join('')}</div>`;
    }
    function renderFloors() {
      content.innerHTML = `<div class="section-title">依樓層瀏覽 <span class="count">${floorsData.length}</span></div><div class="grid">${floorsData.map(f => `
        <div class="floor-card" id="floor-${f.floor}">
          <div class="item-name">第 ${f.floor} 層 <span style="font-weight:400;color:var(--muted);font-size:0.85rem">${f.lv}</span></div>
          <div class="boss-name">${f.boss}</div>
          ${f.drops.map(d => `<div class="drop-row"><div class="drop-name-row"><span class="type-badge type-${d.type}">${d.type}</span><strong>${d.name}</strong>
            <button class="copy-btn" onclick="copyName('${d.name.replace(/'/g,"\\'")}',this)">複製</button></div>
            <div class="stats">${d.stats}</div></div>`).join('')}
        </div>`).join('')}</div>`;
    }
    function filterAndRender() {
      if (currentView === 'floors' && !searchQuery) {
        weaponSubtabs.classList.remove('show');
        renderFloors();
        return;
      }
      weaponSubtabs.classList.toggle('show', currentView === '武器');
      let list = allItems;
      if (currentView === '武器') {
        list = list.filter(i => i.main === '武器');
        if (currentSubtype !== 'all') list = list.filter(i => i.type === currentSubtype);
      } else if (currentView !== 'search' && currentView !== 'floors') {
        list = list.filter(i => i.main === currentView);
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        list = list.filter(i => i.name.toLowerCase().includes(q) || i.stats.toLowerCase().includes(q) || i.type.toLowerCase().includes(q));
      }
      renderItems(list);
    }
    function goToFloor(n) {
      currentView = 'floors'; currentSubtype = 'all';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-view="floors"]').classList.add('active');
      document.querySelectorAll('.subtab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-subtype="all"]').classList.add('active');
      searchInput.value = ''; searchQuery = '';
      renderFloors();
      setTimeout(() => {
        const el = document.getElementById('floor-'+n);
        if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.borderColor='var(--accent)'; setTimeout(()=>el.style.borderColor='',2000); }
      }, 50);
    }
    tabs.addEventListener('click', e => {
      const btn = e.target.closest('.tab'); if (!btn) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); btn.classList.add('active');
      currentView = btn.dataset.view;
      if (currentView !== '武器') currentSubtype = 'all';
      searchInput.value = ''; searchQuery = '';
      filterAndRender();
    });
    weaponSubtabs.addEventListener('click', e => {
      const btn = e.target.closest('.subtab'); if (!btn) return;
      document.querySelectorAll('.subtab').forEach(t => t.classList.remove('active')); btn.classList.add('active');
      currentSubtype = btn.dataset.subtype; filterAndRender();
    });
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim();
      if (searchQuery) {
        // 有搜尋時顯示結果，暫時取消樓層高亮
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        currentView = 'search';
      } else {
        // 清空搜尋回到依樓層
        currentView = 'floors';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector('[data-view="floors"]').classList.add('active');
      }
      filterAndRender();
    });
    filterAndRender();
  </script>
</body>
</html>
